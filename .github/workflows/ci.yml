name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  test:
    name: lint · migrate · test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrations run
        run: alembic upgrade head

      - name: Migrations are idempotent
        run: alembic upgrade head

      - name: Migrations reverse cleanly
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest -q

      - name: Smoke — real services write path
        run: python -m tests.smoke

      - name: Secret scan — no committed .env
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked — Non-Negotiable #10 violated"
            exit 1
          fi
          echo "no .env tracked"
