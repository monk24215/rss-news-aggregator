[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.models", "app.services", "app.services.ai", "app.tasks"]

[project]
name = "rss-news-aggregator"
version = "0.1.0"
description = "AI RSS News Aggregator — foundation skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "jinja2==3.1.5",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "arq==0.26.3",
    "redis==5.2.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "httpx==0.28.1",
    "feedparser==6.0.11",
    # Form posts in the admin interface (§35.4 actions).
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these files; its formatting is not ours to police, and reformatting a
# migration after it has run is a good way to introduce a difference between what was
# reviewed and what was applied. Correctness still matters here — only line length and
# import order are waived.
"alembic/versions/*.py" = ["E501", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
